services:
  # Postgres is not managed here — it runs as a standing container on the
  # host (localhost:5432, postgres/postgres), started once outside this
  # stand and left running. `make db` connects to it and creates the
  # `remember` database if missing; nothing here starts or stops it.

  # Local stand-in for Google Cloud Storage — the same S3 API as its XML API,
  # so the API talks to both through one code path. The bucket is made by creating its directory
  # before the server starts: MinIO takes a directory under its data root for a
  # bucket, which is a line here instead of a second container running `mc`.
  minio:
    image: minio/minio
    entrypoint:
      ["sh", "-c", "mkdir -p /data/remember && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: remember
      MINIO_ROOT_PASSWORD: remember-secret
    ports:
      - "9000:9000"
      # The web console — nothing depends on it; it is how one looks at what
      # actually landed in the bucket.
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  miniodata:
