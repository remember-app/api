services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: remember
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: remember
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remember -d remember"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
